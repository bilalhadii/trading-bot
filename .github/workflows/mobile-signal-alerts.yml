name: Mobile Signal Alerts

on:
  workflow_dispatch:
    inputs:
      symbol:
        description: Stock symbols to scan, comma-separated
        required: true
        default: AAPL,NVDA,SNDK,INTC,GOOGL
      cutoff:
        description: New York cutoff time
        required: true
        default: "10:15"
      strategies:
        description: Strategy lanes to scan, comma-separated
        required: true
        default: ORB_RETEST_RECLAIM_BODY_2R,HTF_BREAKOUT_RETEST_2R
  schedule:
    # Backup triggers around the intended 09:25 New York start during
    # US daylight time. GitHub scheduled runs can be delayed or dropped,
    # so we use several attempts and keep only the latest active run.
    - cron: "20,25,30,35,40 13 * * 1-5"
    # Backup triggers around the intended 09:25 New York start during
    # US standard time. During daylight time, after-cutoff runs exit.
    - cron: "20,25,30,35,40 14 * * 1-5"

concurrency:
  group: mobile-signal-alerts-${{ github.ref }}
  cancel-in-progress: true

jobs:
  mobile-signal-alerts:
    runs-on: ubuntu-latest
    timeout-minutes: 140

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install alpaca-py python-dotenv pandas sqlalchemy psycopg2-binary pytest

      - name: Run live dry-run signal watcher
        env:
          ALPACA_API_KEY: ${{ secrets.ALPACA_API_KEY }}
          ALPACA_SECRET_KEY: ${{ secrets.ALPACA_SECRET_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: |
          SYMBOLS="${{ github.event.inputs.symbol || 'AAPL,NVDA,SNDK,INTC,GOOGL' }}"
          CUTOFF="${{ github.event.inputs.cutoff || '10:15' }}"
          STRATEGIES="${{ github.event.inputs.strategies || 'ORB_RETEST_RECLAIM_BODY_2R,HTF_BREAKOUT_RETEST_2R' }}"
          python scripts/paper_trade.py \
            --symbols "$SYMBOLS" \
            --strategies "$STRATEGIES" \
            --source live \
            --watch \
            --discord \
            --alert-status \
            --poll-seconds 60 \
            --cutoff "$CUTOFF" \
            --equity 10000
